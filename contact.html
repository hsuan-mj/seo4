<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡我們 | Spinning Records</title>
    <meta name="description" content="Contact Spinning Records.">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo-container">
                <img src="images/logo.png" alt="Spinning Records Logo">
                <span class="logo-text">Spinning Records</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">首頁</a></li>
                <li><a href="kpop.html">韓國專輯</a></li>
                <li><a href="jpop.html">日本專輯</a></li>
                <li><a href="others.html">其它類</a></li>
                <li><a href="about.html">公司簡介</a></li>
                <li><a href="contact.html">聯絡我們</a></li>
            </ul>
        </div>
    </header>

    <main>
        <section class="section" style="margin-top: 8rem;">
            <h1 class="section-title">聯絡我們 (Contact Us)</h1>
            <div class="info-box">
                <form onsubmit="event.preventDefault(); alert('Message sent successfully!');">
                    <div class="form-group">
                        <label for="name">姓名 (Name)</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">電子郵件 (Email)</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">訊息 (Message)</label>
                        <textarea id="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn">發送 (Send)</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Spinning Records. All rights reserved.</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
